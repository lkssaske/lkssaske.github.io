function ibDo(id,i){const x=IB().find(m=>m.id==id),a=x.acts[i],d=a.d||{},p=d.p&&G.players[d.p];
 const sellTo=f=>{if(!p||p.club!=G.me||!canLose(G.me,p)){x.done='This deal is no longer possible.';return}const b=G.clubs[d.c];G.money+=f;p.club=b.id;p.list=0;p.w=0;p.role=null;G.xi=G.xi.filter(q=>q!=p.id);news(`Sold ${p.n} to ${b.name} for ${M$(f)}.`);x.done=`Sold to ${b.name} for ${M$(f)}.`};

 const r=G.res[0],k=r&&r.w+'-'+r.s;if(r&&G.mr!=k){G.mr=k;msg('Assistant Manager','Match report',`${G.clubs[r.h].name} ${r.sc[0]}-${r.sc[1]} ${G.clubs[r.a].name} (${r.c}). ${r.r=='W'?'Good result, the lads are buzzing.':r.r=='L'?'Tough one. The dressing room needs lifting.':'A point to build on.'}`)}

  let cs=Object.values(G.clubs).filter(x=>x.id!=G.me&&x.rep>=me.rep-1&&x.rep<=me.rep+(G.conf>=85?3:2));const o=cs.filter(x=>x.lg!=me.lg);if(o.length)cs=o;

function bFund(a){const key=G.season+'f',n=G.bqd[key]||0;G.bqd[key]=n+1;const L=[['me',`Could the club release ${M$(a)} for transfers?`]];

 else L.push(['th','"The finances do not allow it right now."']);

function facMenu(){modal(`<div class="cd h2">Facility projects</div><div class="mut" style="margin-bottom:8px">The board must approve each project and building takes weeks. Academy: better intake. Training: faster growth. Stadium: weekly income.</div>`+Object.entries(FAC).map(([k,n])=>{const L=G[k]||0,b=(G.proj||[]).find(j=>j.k==k);return `<div class="row" style="margin:0 0 6px"><div class="c"><b>${n}</b> · level ${L}/5<div class="mut">${b?'Under construction - ready week '+(b.d+1):L>=5?'Fully upgraded':'Next level '+M$(fcost(k))}</div></div><button class="btn s" ${b||L>=5?'disabled':''} onclick="fac('${k}')">Request</button></div>`}).join('')+`<button class="btn" onclick="board()">Back</button>`)}
function fac(k){if((G.proj||[]).some(j=>j.k==k))return toast('Already under construction');const L=G[k]||0,cost=fcost(k),n=FAC[k];G.proj=G.proj||[];const lg=[['me',`I would like to invest in the ${n.toLowerCase()}.`]];
 if(G.money<cost)lg.push(['th',`"We cannot afford ${M$(cost)} right now."`]);
 else if(Math.random()<cl(.3+G.conf/150,.1,.9)){G.money-=cost;G.proj.push({k,d:G.week+3+L});lg.push(['th',`"Approved - ${M$(cost)}. Work will take about ${3+L} weeks."`]);msg('Board',n+' project approved',`${M$(cost)} committed. Ready around week ${G.week+4+L}.`)}
 else{G.conf=cl(G.conf-2,0,100);lg.push(['th','"Not now. Come back when results justify it."'])}

let N=null;const clk=p=>p.club?G.clubs[p.club]:null;
const askMul=p=>(sen(p.club).sort((a,b)=>b.r-a.r).slice(0,3).includes(p)?1.25:1)*(p.age<=22&&p.pot-p.r>=8?1.15:1)*(G.mst=='Transfer Guru'?.94:1);
function bmodal(id){const p=G.players[id],fa=p.club===null,c=clk(p);
 if(!fa&&!winOpen())return modal(`<div class="cd" style="font-size:22px">${esc(p.n)}</div><div class="card mut">The transfer window is closed. Only free agents can be signed right now.</div><button class="btn" onclick="closeM()">Close</button>`);
 if(sen(G.me).length>=28)return toast('Squad is full (28)');if(p.lk>G.week)return toast('Their club will not talk to you yet');if(fa&&G.money<0)return toast('Not enough money');
 N={id,st:fa?'wage':'fee',pt:3,wp:3,lg:[],fee:0,cf:0,ask:fa?0:Math.round(val(p)*askMul(p)/1e4)*1e4};
 if(!fa&&!canLose(p.club,p)){N.st='end';N.lg.push(['th',`${esc(c.name)}: "He is not for sale. We have no cover for his position."`])}
 else{N.lg.push(['me',`Hello, I would like to discuss a move for ${esc(p.n)}.`]);if(fa)initWage();else N.lg.push(['th',`${esc(c.name)} (${LG[c.lg]}): "He is important to us. We only talk if the offer is serious."`])}
 drawN()}
function initWage(){const p=G.players[N.id],me=G.clubs[G.me],c=clk(p);N.dem=Math.round(wage(p)*(p.club?1.1:1)*(c&&c.rep>me.rep?1.12:1)*(me.rep>=8?.95:1)/50)*50;N.st='wage';N.yr=3;N.role='First Team';N.ow=N.dem;
 N.lg.push(['th',`${esc(p.n)}'s agent: "He is looking for around ${M$(N.dem)} a week. Show him he is wanted."`])}
function drawN(){const p=G.players[N.id],v=val(p);let ctl='';
 if(N.st=='fee')ctl=`<div class="mut">Your offer: <b id="nl" class="acc">${M$(N.fee||v)}</b> · budget ${M$(G.money)}</div><input type="range" id="ns" min="${Math.round(v*.6)}" max="${Math.round(v*1.8)}" step="10000" value="${N.fee||v}" oninput="$('nl').textContent=M$(+this.value)"><button class="btn p" style="margin:8px 0" onclick="nOffer()">Make offer</button>`+(N.cf?`<button class="btn" style="margin-bottom:6px;width:100%" onclick="nFee(${N.cf})">Accept their ${M$(N.cf)}</button>`:'');
 else if(N.st=='wage')ctl=`<div class="mut">Wage: <b id="nl" class="acc">${M$(N.ow)}</b>/wk</div><input type="range" id="ns" min="${Math.round(N.dem*.7)}" max="${Math.round(N.dem*1.6)}" step="50" value="${N.ow}" oninput="$('nl').textContent=M$(+this.value)"><div class="g2n" style="margin:8px 0"><select id="ny">${[1,2,3,4,5].map(y=>`<option value="${y}" ${y==N.yr?'selected':''}>${y} year${y>1?'s':''}</option>`).join('')}</select><select id="nr">${['Key Player','First Team','Rotation','Prospect'].map(r=>`<option ${r==N.role?'selected':''}>${r}</option>`).join('')}</select></div><button class="btn p" style="margin-bottom:6px" onclick="nWage()">Offer contract</button>`;
 modal(`<div style="display:flex;gap:10px;align-items:center">${hair(p)}<div class="c"><div class="cd" style="font-size:22px">${esc(p.n)}</div><div class="mut">${p.pos} · Age ${p.age} · ${p.r} (pot ${p.pot}) · ${p.club?esc(G.clubs[p.club].name)+' · '+LG[G.clubs[p.club].lg]:'Free agent'}</div></div></div><div style="margin:10px 0">${bub(N.lg)}</div>${ctl}<button class="btn" style="width:100%" onclick="N=null;closeM()">Walk away</button>`);
 const e=$('mdc').querySelector('div[style*=overflow-y]');if(e)e.scrollTop=1e5}
function nOffer(){const p=G.players[N.id],c=clk(p),f=+$('ns').value,r=f/N.ask;
 if(f>G.money){N.lg.push(['me',`We can offer ${M$(f)}.`],['th','(Your budget does not cover that.)']);return drawN()}
 N.lg.push(['me',`We are prepared to offer ${M$(f)}.`]);if(r>=.96)return nFee(f);N.pt--;
 if(r<.75){N.pt--;N.lg.push(['th',P(['"That is an insult. Do not waste our time."','"Not even close to his valuation."'])])}
 else{N.cf=Math.round(N.ask*.97/1e4)*1e4;N.ask=N.cf;N.lg.push(['th',`"Still short. We would accept ${M$(N.cf)}."`])}
 if(N.pt<=0){p.lk=G.week+4;N.st='end';N.cf=0;N.lg.push(['th',`${esc(c.name)} end the talks. They will not negotiate again for a month.`])}
 N.fee=f;drawN()}
function nFee(f){if(f>G.money){toast('Your budget does not cover that');return}N.fee=f;N.cf=0;N.lg.push(['th',`"Deal. ${M$(f)} and he is yours, if the player agrees terms."`]);initWage();drawN()}
function nWage(){const p=G.players[N.id],w=+$('ns').value;N.yr=+$('ny').value;N.role=$('nr').value;N.ow=w;
 const better=sen(G.me).filter(x=>x.pos==p.pos&&x.r>p.r).length,lim={'Key Player':1,'First Team':3,'Rotation':99,'Prospect':99}[N.role],need=N.dem*(N.yr>=4?(p.age<=26?.96:1.06):1);
 N.lg.push(['me',`${M$(w)} a week for ${N.yr} year${N.yr>1?'s':''}, as a ${N.role}.`]);
 if(better>=lim||(N.role=='Prospect'&&p.age>22)){N.wp--;N.lg.push(['th',`Agent: "Be realistic - you already have ${better} better ${p.pos}s. That role does not fit him."`])}
 else if(w>=need)return nSign(w);
 else{N.wp--;if(w/need>=.9){N.ow=Math.ceil(need/50)*50;N.lg.push(['th',`Agent: "Very close. ${M$(N.ow)} and we have a deal."`])}else N.lg.push(['th','Agent: "That is well below what he can earn elsewhere."'])}
 if(N.wp<=0){N.st='end';N.lg.push(['th','Agent: "We are done. He is going elsewhere."'])}drawN()}
function nSign(w){const p=G.players[N.id],fa=p.club===null,s=clk(p);if(!fa){G.money-=N.fee;mkP(s.id,p.pos,p.r-R(2,6),R(20,30))}
 p.club=G.me;p.w=w;p.ctr=N.yr;p.role=N.role;p.lk=0;news(`Signed ${p.n} (${p.r}) ${fa?'on a free':'for '+M$(N.fee)}.`);
 msg('Transfers','Signing complete: '+p.n,`${p.n} joined from ${fa?'free agency':s.name}${fa?'':' for '+M$(N.fee)} on ${M$(w)}/wk for ${N.yr} year(s). Promised role: ${N.role}.`);
 N=null;save();closeM();renderMarket();toast('Signed '+p.n)}
function sell(id){const p=G.players[id];p.list=!p.list;save();closeM();toast(p.list?p.n+' is transfer-listed. Bids will arrive in your inbox.':p.n+' taken off the list.');renderSquad()}

let SEL=null;const zone=id=>G.xi.includes(id)?'x':(G.bn||[]).includes(id)?'b':'r';
function fixBn(){G.bn=(G.bn||[]).filter((i,j,a)=>{const p=G.players[i];return p&&p.club==G.me&&!p.acad&&avail(p)&&!G.xi.includes(i)&&a.indexOf(i)==j}).slice(0,7);
 const rest=sen(G.me).filter(p=>avail(p)&&!G.xi.includes(p.id)&&!G.bn.includes(p.id)).sort((x,y)=>y.r-x.r);if(!G.bn.some(i=>G.players[i].pos=='GK')&&G.bn.length<7){const g=rest.find(p=>p.pos=='GK');if(g){G.bn.push(g.id);rest.splice(rest.indexOf(g),1)}}
 while(G.bn.length<7&&rest.length)G.bn.push(rest.shift().id)}
function autoXI(){G.xi=auto(G.me,G.fm).map(p=>p.id);const rest=sen(G.me).filter(p=>avail(p)&&!G.xi.includes(p.id)).sort((a,b)=>b.r-a.r),b=[],g=rest.find(p=>p.pos=='GK');if(g)b.push(g);rest.forEach(p=>{if(b.length<7&&!b.includes(p))b.push(p)});G.bn=b.map(p=>p.id)}
function pick(id){if(SEL==null||SEL==id){SEL=SEL==id?null:id;return renderSquad()}
 const a=SEL,b=id,za=zone(a),zb=zone(b),rep=(arr,o,n)=>{const i=arr.indexOf(o);if(i>=0)arr[i]=n};SEL=null;
 if(za==zb){SEL=b;return renderSquad()}
 if(za=='x'||zb=='x'){const X=za=='x'?a:b,O=za=='x'?b:a,zo=zone(O),pX=G.players[X],pO=G.players[O];
  if(!avail(pO)){toast(pO.n+' is unavailable');return renderSquad()}
  if((pX.pos=='GK')!=(pO.pos=='GK')){toast('A keeper can only swap with another keeper');return renderSquad()}
  rep(G.xi,X,O);if(zo=='b')rep(G.bn,O,X)}
 else{const B=za=='b'?a:b,Rr=za=='b'?b:a;if(!avail(G.players[Rr])){toast('Player unavailable');return renderSquad()}rep(G.bn,B,Rr)}

function renderSquad(){if(!G.bn)autoXI();fixBn();const all=sen(G.me),x=G.xi.map(i=>G.players[i]).filter(p=>p&&p.club==G.me&&!p.acad),bn=G.bn.map(i=>G.players[i]),rs=all.filter(p=>zone(p.id)=='r').sort((a,b)=>POS.indexOf(a.pos)-POS.indexOf(b.pos)||b.r-a.r),sp=SEL&&G.players[SEL];
 const sl=(k,arr)=>`<select onchange="G.${k}=this.value;${k=='fm'?'autoXI();':''}renderSquad()">${arr.map(v=>`<option ${G[k]==v?'selected':''}>${v}</option>`).join('')}</select>`,

 $('squad').innerHTML=`<div class="hdr"><h1>Squad & Tactics</h1><div class="badge">XI ${x.length}/11 · ${shape(x)} · avg ${x.length?Math.round(x.reduce((s,p)=>s+p.r,0)/x.length):0}</div></div>

 <div class="mut" style="padding:0 16px 6px">${sp?'Selected <b>'+esc(sp.n)+'</b>. Tap who swaps with him (pitch, bench or reserves).':'Tap a player, then tap the player who replaces him.'}${x.length!=11?' <span class="red">XI needs 11 players.</span>':''}</div>
 <div class="pitch">${['ATT','MID','DEF','GK'].map(k=>`<div class="pr">${x.filter(p=>p.pos==k).map(p=>`<div class="pp" style="${hl(p.id)}" onclick="pick(${p.id})">${shirt(p)}<div>${esc(p.n.split(' ').pop())}</div><b>${p.r}</b></div>`).join('')}</div>`).join('')}</div>
 <div class="sec">SUBSTITUTES (${bn.length}/7)</div><div style="display:flex;gap:6px;overflow-x:auto;padding:0 12px 6px">${bn.map(p=>`<div class="bch" style="${hl(p.id)}" onclick="pick(${p.id})"><span class="pos ${p.pos}">${p.pos}</span>${esc(p.n.split(' ').pop())}<b class="acc">${p.r}</b></div>`).join('')||'<span class="mut">No substitutes</span>'}</div>
